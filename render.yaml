services:
  - type: web
    name: agenda-odontologica
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: es_AR
      - key: WHATSAPP_API_VERSION
        value: v26.0
